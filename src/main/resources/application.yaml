spring:
  application:
    name: Backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eulji_festival?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:eulji_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false

security:
  access-token-ttl: ${ACCESS_TOKEN_TTL:PT1H}

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha
