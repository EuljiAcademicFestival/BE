spring:
  application:
    name: Backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eulji_festival?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:eulji_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
