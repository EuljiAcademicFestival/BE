spring:
  application:
    name: Backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eulji_festival?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:eulji_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false

cache:
  character-labels:
    ttl: ${CHARACTER_LABEL_CACHE_TTL:PT5M}
    maximum-size: ${CHARACTER_LABEL_CACHE_MAXIMUM_SIZE:10000}

security:
  access-token-ttl: ${ACCESS_TOKEN_TTL:PT1H}
  jwt-secret: ${JWT_SECRET}
  jwt-issuer: ${JWT_ISSUER:eulji-academic-festival}

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

server:
  tomcat:
    mbeanregistry:
      enabled: true
