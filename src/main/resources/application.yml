spring:
  application:
    name: Backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eulji_festival?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:eulji_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false

cache:
  top-rankings:
    ttl: ${RANKING_TOP_CACHE_TTL:PT1S}
  character-labels:
    ttl: ${CHARACTER_LABEL_CACHE_TTL:PT5M}
    maximum-size: ${CHARACTER_LABEL_CACHE_MAXIMUM_SIZE:10000}

security:
  access-token-ttl: ${ACCESS_TOKEN_TTL:PT1H}
  jwt-secret: ${JWT_SECRET}
  jwt-issuer: ${JWT_ISSUER:eulji-academic-festival}
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:https://eulji-academic-festival.vercel.app,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

realtime:
  engagement:
    interval-ms: 200
  max-players: ${WS_MAX_PLAYERS:200}
  coordinate-limit: ${WS_COORDINATE_LIMIT:1000}
  max-messages-per-second: ${WS_MAX_MESSAGES_PER_SECOND:30}
  allowed-origins: ${WS_ALLOWED_ORIGINS:${security.cors.allowed-origins}}

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

server:
  tomcat:
    mbeanregistry:
      enabled: true
